[package]
name = "cc-reminder"
version = "0.1.0"
edition = "2024"
default-run = "cc-reminder"

[features]
test-support = []

[lib]
name = "cc_reminder_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "cc-reminder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.91"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6"
hex = "0.4"
hmac = "0.12"
keyring = "4.1.6"
rand = "0.10.2"
regex = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "chrono", "uuid"] }
secrecy = "0.10.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
