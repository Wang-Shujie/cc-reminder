[package]
name = "cc-reminder"
version = "0.1.0"
edition = "2024"
default-run = "cc-reminder"

[lib]
name = "cc_reminder_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "cc-reminder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.91"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
regex = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "chrono", "uuid"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }
